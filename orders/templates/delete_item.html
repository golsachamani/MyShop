{% extends 'base.html' %}
{% block title %}
  Post Delete
{% endblock %}
{% block content %}
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card border-danger shadow-sm">
          <div class="card-header bg-danger text-white">
            <h5 class="mb-0">⚠️ Delete Item</h5>
          </div>
          <div class="card-body">
            <p class="fs-5">Are you sure you want to delete this Item?</p>
            <div class="alert alert-warning">
              <strong>{{ item.product.name }}</strong><br />
              This action <u>cannot be undone</u>.
            </div>

            <!-- ✅ مهم: method="post" -->
            <form method="post" action="{% url 'remove_item' item.id %}">
              {% csrf_token %}
              <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'order_list' %}" class="btn btn-outline-secondary">❌ Cancel</a>
                <button type="submit" class="btn btn-danger">🗑️ Yes, Delete</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
